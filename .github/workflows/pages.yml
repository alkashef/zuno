# Publishes the one-file page to GitHub Pages (PKG-001, DEC-023).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir site-out && cp dist/zuno.html site-out/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-out
      - id: deployment
        uses: actions/deploy-pages@v5
