<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--zuno:csp-->
    <title>Zuno</title>
    <!--zuno:icon-->
    <!--zuno:style-->
  </head>
  <body>
    <header class="header" data-role="header">
      <div class="header-brand">
        <h1 class="header-title">Zuno</h1>
        <p class="header-subtitle">Many time zones, One team!</p>
      </div>
      <p class="header-updated" data-role="updated"></p>
      <span class="notices" data-role="notices">
        <button
          type="button"
          class="button button-icon notices-button"
          data-action="toggleNotices"
          aria-label="Notices"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          <svg class="icon notices-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 8h.01M11 12h1v5h1" />
          </svg>
          <span class="notices-badge" data-role="notices-badge" hidden></span>
        </button>
        <div
          class="notices-card"
          data-role="notices-card"
          role="dialog"
          aria-label="Notices"
          hidden
        >
          <p class="notices-title">Some holiday data is missing.</p>
          <ul class="notices-list" data-role="notices-list"></ul>
        </div>
      </span>
      <button type="button" class="button" data-action="refresh">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
        </svg>
        Refresh
      </button>
      <button type="button" class="button" data-action="openSettings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 6h9M19 6h1M4 12h1M11 12h9M4 18h11M21 18h-1" />
          <circle cx="16" cy="6" r="2.5" />
          <circle cx="8" cy="12" r="2.5" />
          <circle cx="18" cy="18" r="2.5" />
        </svg>
        Settings
      </button>
    </header>
    <main class="page" data-role="page"></main>

    <template id="legend-month-template">
      <ul class="legend-list">
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-weekend" data-role="legend-swatch"></span>
          <span data-role="legend-name">Weekend</span>
        </li>
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-holiday" data-role="legend-swatch"></span>
          <span data-role="legend-name">Public holiday</span>
        </li>
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-split" data-role="legend-swatch"></span>
          <span data-role="legend-name">Weekend and holiday</span>
        </li>
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-vacation" data-role="legend-swatch"></span>
          <span data-role="legend-name">Vacation</span>
        </li>
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-today" data-role="legend-swatch"></span>
          <span data-role="legend-name">Today</span>
        </li>
      </ul>
    </template>

    <template id="legend-picker-template">
      <ul class="legend-list">
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-working" data-role="legend-swatch"></span>
          <span data-role="legend-name">Working hours</span>
        </li>
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-non-working" data-role="legend-swatch"></span>
          <span data-role="legend-name">Non-working hours</span>
        </li>
        <li class="legend-item">
          <span class="legend-swatch legend-swatch-day-off" data-role="legend-swatch"></span>
          <span data-role="legend-name">Day off: weekend, holiday or vacation</span>
        </li>
      </ul>
    </template>

    <template id="notice-item-template">
      <li class="notices-item" data-role="notice-item"></li>
    </template>

    <template id="empty-page-template">
      <section class="empty" data-role="empty" aria-labelledby="empty-title">
        <span class="empty-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
          </svg>
        </span>
        <h2 id="empty-title" class="empty-title">No places yet</h2>
        <p class="empty-text">
          Add a place to see its local time, its weekends and its public holidays.
        </p>
        <button type="button" class="button button-primary empty-add" data-action="openSettings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" />
          </svg>
          Add a place
        </button>
      </section>
    </template>

    <template id="map-template">
      <section class="map" data-role="map" aria-label="World map">
        <div class="map-view" data-role="map-view">
          <svg
            class="map-outline"
            viewBox="0 20 720 276"
            preserveAspectRatio="none"
            aria-hidden="true"
            focusable="false"
          >
            <!--zuno:map-outline-->
          </svg>
          <ol class="map-pins" data-role="pins"></ol>
        </div>
      </section>
    </template>

    <template id="map-resize-template">
      <button
        type="button"
        class="map-resize"
        data-role="map-resize"
        aria-label="Change the height of the map"
      >
        <span class="map-resize-grip"></span>
      </button>
    </template>

    <template id="map-pin-template">
      <li class="map-pin" data-role="pin">
        <svg class="map-pin-icon" viewBox="0 0 24 22" aria-hidden="true" focusable="false">
          <path class="map-pin-body" d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" />
          <circle class="map-pin-hole" cx="12" cy="10" r="2.5" />
        </svg>
        <span class="map-pin-label">
          <span class="map-pin-name" data-role="pin-name"></span>
          <span class="map-pin-time" data-role="pin-time"></span>
          <span class="map-pin-date" data-role="pin-date"></span>
        </span>
      </li>
    </template>

    <template id="month-grid-template">
      <section class="month-grid" data-role="month-grid" aria-labelledby="month-grid-title">
        <div class="month-grid-header">
          <button
            type="button"
            class="button button-icon"
            data-role="earlier"
            aria-label="Previous month"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
          <h2 id="month-grid-title" class="month-grid-title" data-role="title"></h2>
          <button
            type="button"
            class="button button-icon"
            data-role="later"
            aria-label="Next month"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
        <div class="month-grid-scroll" data-role="grid-scroll">
          <table class="month-grid-table">
            <thead data-role="head"></thead>
            <tbody data-role="body"></tbody>
          </table>
        </div>
        <div
          class="legend"
          data-role="legend"
          data-legend="month"
          role="group"
          aria-label="Legend of the month view"
        ></div>
      </section>
    </template>

    <template id="cell-card-template">
      <div class="cell-card" role="tooltip" data-role="cell-card"></div>
    </template>

    <template id="cell-card-entry-template">
      <div class="cell-card-entry">
        <p class="cell-card-title">
          <span class="cell-card-swatch" data-role="card-swatch" aria-hidden="true"></span>
          <span class="cell-card-name" data-role="card-name"></span>
        </p>
        <p class="cell-card-facts">
          <span data-role="card-date"></span>
          <span class="cell-card-hijri" data-role="card-hijri" hidden></span>
          <span data-role="card-kind"></span>
        </p>
      </div>
    </template>

    <template id="day-menu-template">
      <div class="day-menu" role="menu" aria-label="Day" data-role="day-menu"></div>
    </template>

    <template id="day-menu-item-template">
      <button type="button" class="day-menu-item" role="menuitem" data-role="menu-item"></button>
    </template>

    <template id="day-dialog-template">
      <dialog class="day-dialog" data-role="day-dialog" aria-labelledby="day-dialog-title">
        <h2 class="day-dialog-title" id="day-dialog-title" data-role="dialog-title"></h2>
        <div data-role="dialog-body"></div>
      </dialog>
    </template>

    <template id="day-holiday-form-template">
      <form class="day-dialog-form" data-role="holiday-form" novalidate>
        <label class="day-dialog-field">
          <span class="day-dialog-label">Name</span>
          <input type="text" class="day-dialog-input" data-role="dialog-name" autofocus />
        </label>
        <label class="day-dialog-field">
          <span class="day-dialog-label">Date</span>
          <input type="date" class="day-dialog-input" data-role="dialog-date" />
        </label>
        <div class="day-dialog-buttons">
          <button type="button" class="button" data-role="dialog-cancel">Cancel</button>
          <button type="submit" class="button button-primary">Add holiday</button>
        </div>
      </form>
    </template>

    <template id="day-vacation-form-template">
      <form class="day-dialog-form" data-role="vacation-form" novalidate>
        <label class="day-dialog-field">
          <span class="day-dialog-label">Start date</span>
          <input type="date" class="day-dialog-input" data-role="dialog-start" autofocus />
        </label>
        <label class="day-dialog-field">
          <span class="day-dialog-label">End date</span>
          <input type="date" class="day-dialog-input" data-role="dialog-end" />
        </label>
        <label class="day-dialog-field">
          <span class="day-dialog-label">Label (optional)</span>
          <input type="text" class="day-dialog-input" data-role="dialog-label" />
        </label>
        <p class="day-dialog-error" role="alert" data-role="dialog-error"></p>
        <div class="day-dialog-buttons">
          <button type="button" class="button" data-role="dialog-cancel">Cancel</button>
          <button type="submit" class="button button-primary" data-role="dialog-submit"></button>
        </div>
      </form>
    </template>

    <template id="import-dialog-template">
      <dialog class="day-dialog" data-role="import-dialog" aria-labelledby="import-dialog-title">
        <h2 class="day-dialog-title" id="import-dialog-title">Import holidays and vacations</h2>
        <div class="day-dialog-form">
          <p class="day-dialog-note" data-role="import-summary"></p>
          <p class="day-dialog-note" data-role="import-missing" hidden></p>
          <p class="day-dialog-note" data-role="import-invalid" hidden></p>
          <div class="day-dialog-buttons">
            <button type="button" class="button" data-role="import-cancel">Cancel</button>
            <button type="button" class="button button-primary" data-role="import-add"></button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="import-delete-template">
      <dialog class="day-dialog" data-role="delete-dialog" aria-labelledby="import-delete-title">
        <h2 class="day-dialog-title" id="import-delete-title">Delete imported file</h2>
        <div class="day-dialog-form">
          <p class="day-dialog-note" data-role="delete-summary"></p>
          <p class="day-dialog-note" data-role="delete-stay" hidden></p>
          <div class="day-dialog-buttons">
            <button type="button" class="button" data-role="delete-cancel">Cancel</button>
            <button type="button" class="button button-primary" data-role="delete-confirm"></button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="hijri-note-template">
      <span class="hijri-note" data-role="hijri-note">
        <button
          type="button"
          class="hijri-note-button"
          data-role="note-button"
          aria-label="About Hijri dates"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 8h.01M11 12h1v5h1" />
          </svg>
        </button>
        <div
          class="hijri-note-card"
          data-role="note-card"
          role="dialog"
          aria-label="About Hijri dates"
          hidden
        >
          Hijri dates are calculated and may differ from official announcements.
        </div>
      </span>
    </template>

    <template id="picker-template">
      <section class="picker" data-role="picker" aria-label="Meeting time">
        <button
          type="button"
          class="picker-resize"
          data-role="resize"
          aria-label="Change the width of the meeting-time picker"
        >
          <span class="picker-resize-grip"></span>
        </button>
        <div data-role="day-selector-slot"></div>
        <div class="picker-scroll" data-role="scroll">
          <div class="picker-axis" data-role="axis"></div>
          <div class="picker-content" data-role="content">
            <ul class="picker-rows" data-role="rows"></ul>
            <div class="picker-line"></div>
            <div
              class="picker-handle"
              data-role="handle"
              role="slider"
              tabindex="0"
              aria-label="Chosen time"
            ></div>
          </div>
        </div>
        <div
          class="legend"
          data-role="legend"
          data-legend="picker"
          role="group"
          aria-label="Legend of the picker"
        ></div>
      </section>
    </template>

    <template id="picker-row-template">
      <li class="picker-row" data-role="row">
        <div class="picker-info" data-role="info">
          <div class="picker-who" data-role="who">
            <p class="picker-name-line">
              <span class="picker-name" data-role="name"></span>
              <span class="picker-zone" data-role="zone"></span>
            </p>
            <p class="picker-sub" data-role="sub" hidden></p>
          </div>
          <button type="button" class="button button-icon pin-button" data-role="place-pin">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 3h6l-1 6 3 3v2H7v-2l3-3zM12 14v7" />
            </svg>
          </button>
        </div>
        <div class="picker-band">
          <div class="picker-track" data-role="track">
            <div class="picker-mark" data-role="mark">
              <p class="picker-when">
                <span class="picker-time" data-role="local-time"></span>
                <span class="picker-date" data-role="local-date"></span>
              </p>
              <span class="picker-hijri" data-role="local-hijri" hidden></span>
            </div>
          </div>
          <span class="picker-hover" data-role="hover" hidden></span>
        </div>
      </li>
    </template>

    <template id="day-selector-template">
      <div class="day-selector" data-role="day-selector">
        <button
          type="button"
          class="button button-icon"
          data-role="previous"
          aria-label="Previous day"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <button
          type="button"
          class="button day-selector-date"
          data-role="date"
          aria-haspopup="dialog"
          aria-expanded="false"
        ></button>
        <button type="button" class="button button-icon" data-role="next" aria-label="Next day">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 6l6 6-6 6" />
          </svg>
        </button>
        <button
          type="button"
          class="button day-selector-now"
          data-role="reset-marker"
          title="Reset the marker to the current time"
        >
          Now
        </button>
      </div>
    </template>

    <template id="calendar-template">
      <div class="calendar" data-role="calendar" role="dialog" aria-label="Choose a day">
        <div class="calendar-header">
          <button
            type="button"
            class="calendar-step"
            data-role="earlier"
            aria-label="Earlier month"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
          <h3 class="calendar-title" data-role="title"></h3>
          <button type="button" class="calendar-step" data-role="later" aria-label="Later month">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
        <table class="calendar-table">
          <thead>
            <tr>
              <th scope="col">Su</th>
              <th scope="col">Mo</th>
              <th scope="col">Tu</th>
              <th scope="col">We</th>
              <th scope="col">Th</th>
              <th scope="col">Fr</th>
              <th scope="col">Sa</th>
            </tr>
          </thead>
          <tbody data-role="weeks"></tbody>
        </table>
      </div>
    </template>

    <template id="settings-panel-template">
      <aside class="settings" data-role="settings" role="dialog" aria-labelledby="settings-title">
        <div class="settings-header">
          <h2 id="settings-title" class="settings-title">Settings</h2>
          <button
            type="button"
            class="button button-icon"
            data-role="close"
            aria-label="Close settings"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div class="settings-tabs" role="tablist" aria-label="Settings" data-role="tabs">
          <button
            type="button"
            class="settings-tab"
            role="tab"
            id="settings-tab-general"
            aria-controls="settings-panel-general"
          >
            General
          </button>
          <button
            type="button"
            class="settings-tab"
            role="tab"
            id="settings-tab-places"
            aria-controls="settings-panel-places"
          >
            Places
          </button>
          <button
            type="button"
            class="settings-tab"
            role="tab"
            id="settings-tab-holidays"
            aria-controls="settings-panel-holidays"
          >
            Holidays and vacations
          </button>
        </div>
        <div
          class="settings-cards"
          role="tabpanel"
          id="settings-panel-general"
          aria-labelledby="settings-tab-general"
        >
          <section class="settings-section" aria-labelledby="settings-hours-title">
            <h3 id="settings-hours-title" class="settings-heading">Working hours</h3>
            <div class="settings-pair">
              <label class="settings-field">
                <span class="settings-label">Start</span>
                <select class="settings-input" data-role="work-start"></select>
              </label>
              <label class="settings-field">
                <span class="settings-label">End</span>
                <select class="settings-input" data-role="work-end"></select>
              </label>
            </div>
            <p class="settings-hint settings-hint-large">
              One setting for all places. It colours the working hours in the meeting-time picker.
            </p>
          </section>
          <section
            class="settings-section settings-section-tight"
            aria-labelledby="settings-display-title"
          >
            <h3 id="settings-display-title" class="settings-heading">Display</h3>
            <label class="settings-check">
              <input type="checkbox" data-role="show-country" />
              Show country names
            </label>
            <p class="settings-hint settings-hint-close">
              Off by default. When on, the country appears next to each place.
            </p>
            <label class="settings-check">
              <input type="checkbox" data-role="show-hijri" />
              <span class="settings-hijri">Show Hijri calendar</span>
            </label>
            <p class="settings-hint settings-hint-close">
              Off by default. When off, no Hijri dates are shown and the Hijri options for each
              place are not used.
            </p>
            <fieldset class="settings-choice" data-role="theme">
              <legend class="settings-label settings-legend">Theme</legend>
              <div class="settings-options">
                <label class="settings-option">
                  <input type="radio" name="settings-theme" value="light" />
                  Light
                </label>
                <label class="settings-option">
                  <input type="radio" name="settings-theme" value="dark" />
                  Dark
                </label>
                <label class="settings-option">
                  <input type="radio" name="settings-theme" value="auto" />
                  Auto
                </label>
              </div>
            </fieldset>
            <p class="settings-hint">Auto follows the light or dark setting of your system.</p>
          </section>
        </div>
        <div
          class="settings-cards"
          role="tabpanel"
          id="settings-panel-places"
          aria-labelledby="settings-tab-places"
        >
          <section
            class="settings-section settings-section-tight"
            aria-labelledby="settings-add-title"
            data-role="add-place"
          >
            <h3 id="settings-add-title" class="settings-heading">Add a place or person</h3>
            <div class="settings-modes" role="group" aria-label="What to add">
              <button
                type="button"
                class="button settings-mode"
                aria-pressed="true"
                data-role="mode-city"
              >
                A city from the list
              </button>
              <button
                type="button"
                class="button settings-mode"
                aria-pressed="false"
                data-role="mode-custom"
              >
                A person or another city
              </button>
            </div>
            <div class="settings-add-mode" data-role="city-mode">
              <form class="settings-add" data-role="add-form">
                <label class="settings-field">
                  <span class="settings-label">City</span>
                  <select class="settings-input" data-role="city">
                    <option value="">Choose a city</option>
                  </select>
                </label>
                <button type="submit" class="button button-primary settings-add-button">
                  <svg
                    class="icon settings-add-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M12 5v14M5 12h14" />
                  </svg>
                  Add place
                </button>
              </form>
              <p class="settings-hint">The new place uses the time zone of the city.</p>
            </div>
            <div class="settings-add-mode" data-role="custom-mode" hidden>
              <form class="settings-custom" data-role="custom-form">
                <label class="settings-field">
                  <span class="settings-label">Name</span>
                  <input type="text" class="settings-input" data-role="custom-name" />
                </label>
                <label class="settings-field">
                  <span class="settings-label">Time zone</span>
                  <input
                    type="text"
                    class="settings-input"
                    list="settings-zone-list"
                    autocomplete="off"
                    data-role="custom-zone"
                  />
                  <datalist id="settings-zone-list" data-role="zone-list"></datalist>
                </label>
                <label class="settings-field">
                  <span class="settings-label">Country or territory</span>
                  <select class="settings-input" data-role="custom-country">
                    <option value="">Choose a country</option>
                  </select>
                </label>
                <button type="submit" class="button button-primary settings-add-button">
                  <svg
                    class="icon settings-add-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M12 5v14M5 12h14" />
                  </svg>
                  Add place
                </button>
              </form>
              <p class="settings-hint">
                The name can be a person's. The country decides the weekend and the public holidays.
              </p>
            </div>
          </section>
          <section class="settings-section" aria-labelledby="settings-places-title">
            <h3 id="settings-places-title" class="settings-heading">Places</h3>
            <p class="settings-hint settings-hint-large">
              The first place, marked with a filled pin, is the reference for the meeting-time
              picker. Press a pin or use the arrows to change the order.
            </p>
            <ul class="settings-places" data-role="places"></ul>
          </section>
        </div>
        <div
          class="settings-cards"
          role="tabpanel"
          id="settings-panel-holidays"
          aria-labelledby="settings-tab-holidays"
          data-role="holidays"
        >
          <section class="settings-section" aria-labelledby="settings-holidays-title">
            <h3 id="settings-holidays-title" class="settings-heading">Holidays</h3>
            <p class="settings-hint settings-hint-large">
              Add a public holiday that the holiday service does not list. Hide a listed holiday
              from its card in the month view.
            </p>
            <p class="settings-hint" data-role="holiday-table-credit">
              Holidays of India, Israel, Malaysia, Pakistan, Saudi Arabia, Taiwan and the United
              Arab Emirates for 2026 to 2028 come from the date-holidays library (CC BY-SA 3.0).
              Islamic holidays are calculated and can be a day off the official date.
            </p>
            <form class="settings-holiday-form" data-role="holiday-form">
              <label class="settings-field">
                <span class="settings-label">Country</span>
                <select class="settings-input" data-role="holiday-country">
                  <option value="">Choose a country</option>
                </select>
              </label>
              <div class="settings-pair">
                <label class="settings-field">
                  <span class="settings-label">Date</span>
                  <input type="date" class="settings-input" data-role="holiday-date" />
                </label>
                <label class="settings-field">
                  <span class="settings-label">Name</span>
                  <input type="text" class="settings-input" data-role="holiday-name" />
                </label>
              </div>
              <button type="submit" class="button button-primary">
                <svg
                  class="icon settings-add-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                Add holiday
              </button>
            </form>
            <h4 class="settings-label settings-holidays-heading">Added holidays</h4>
            <ul class="settings-holidays" data-role="added" hidden></ul>
            <p class="settings-hint" data-role="added-empty">No holidays added.</p>
            <h4 class="settings-label settings-holidays-heading">Hidden holidays</h4>
            <ul class="settings-holidays" data-role="hidden" hidden></ul>
            <p class="settings-hint" data-role="hidden-empty">No holidays hidden.</p>
          </section>
          <section class="settings-section" aria-labelledby="settings-file-title" data-role="file">
            <h3 id="settings-file-title" class="settings-heading">Holidays and vacations file</h3>
            <div class="settings-file-actions">
              <button type="button" class="button" data-role="holiday-export">Export</button>
              <label class="button settings-file-button">
                Import
                <input
                  type="file"
                  class="settings-file-input"
                  accept=".csv,text/csv"
                  data-role="holiday-file-picker"
                />
              </label>
            </div>
            <p class="settings-hint settings-error" role="alert" data-role="import-refused" hidden>
              The file was refused: it is not a Zuno holidays and vacations file. Nothing was
              changed.
            </p>
            <h4 class="settings-label settings-holidays-heading">Imported files</h4>
            <ul class="settings-holidays" data-role="import-list" hidden></ul>
            <p class="settings-hint" data-role="import-list-empty">No files imported.</p>
            <div class="settings-file-format" data-role="file-format">
              <p class="settings-hint">
                Export saves one CSV file that opens in a spreadsheet. The first row names the
                columns; every other row is one added holiday, one hidden holiday or one vacation.
              </p>
              <dl class="settings-file-columns">
                <dt>Type</dt>
                <dd>holiday, hidden holiday or vacation.</dd>
                <dt>Country</dt>
                <dd>The country's English name, for a holiday or a hidden holiday.</dd>
                <dt>Place</dt>
                <dd>The name of the place, for a vacation.</dd>
                <dt>Start date</dt>
                <dd>The date of the holiday, or the first day of the vacation.</dd>
                <dt>End date</dt>
                <dd>The last day of the vacation. Empty for a holiday.</dd>
                <dt>Name</dt>
                <dd>The name of the holiday, or the label of the vacation.</dd>
              </dl>
              <p class="settings-hint">
                Dates are written as dd-mmm-yy, for example 08-Nov-26. An example of a file with an
                added holiday, a hidden holiday and a vacation:
              </p>
              <pre class="settings-file-example" data-role="file-example">
Type,Country,Place,Start date,End date,Name
holiday,India,,08-Nov-26,,Diwali
hidden holiday,United States,,25-Dec-26,,Christmas Day
vacation,,Sara,21-Dec-26,31-Dec-26,Winter break</pre>
            </div>
          </section>
        </div>
        <p class="settings-footer">
          Changes are saved in this browser and restored on your next visit.
          <br />
          Version <span><!--zuno:version--></span>
        </p>
      </aside>
    </template>

    <template id="settings-place-template">
      <li class="settings-place">
        <div class="settings-place-row">
          <div class="settings-move">
            <button type="button" class="settings-move-button" data-role="up">
              <svg
                class="icon settings-move-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M6 15l6-6 6 6" />
              </svg>
            </button>
            <button type="button" class="settings-move-button" data-role="down">
              <svg
                class="icon settings-move-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
          </div>
          <div class="settings-place-text">
            <p class="settings-place-name" data-role="name"></p>
            <p class="settings-place-facts">
              <span data-role="facts"></span
              ><span class="settings-place-hijri" data-role="hijri" hidden></span>
            </p>
          </div>
          <button type="button" class="button button-icon pin-button" data-role="place-pin">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 3h6l-1 6 3 3v2H7v-2l3-3zM12 14v7" />
            </svg>
          </button>
          <button
            type="button"
            class="button button-icon settings-toggle"
            data-role="toggle"
            aria-expanded="false"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <button type="button" class="button button-icon settings-remove" data-role="remove">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
            </svg>
          </button>
        </div>
        <div class="settings-place-edit" data-role="edit" hidden>
          <div class="settings-group">
            <label class="settings-field">
              <span class="settings-label">Display name</span>
              <input type="text" class="settings-input" data-role="label" />
            </label>
            <p class="settings-hint">
              Shown instead of the city name on the map, in the picker and in the month view. Leave
              it blank to use the city name.
            </p>
          </div>
          <div class="settings-group">
            <label class="settings-field">
              <span class="settings-label">Region for holidays (optional)</span>
              <select class="settings-input" data-role="region"></select>
            </label>
            <p class="settings-hint">With no region, only national holidays are used.</p>
          </div>
          <div class="settings-group">
            <fieldset class="settings-choice">
              <legend class="settings-label settings-legend">Weekend days</legend>
              <div class="settings-options">
                <label class="settings-option">
                  <input type="checkbox" data-role="weekend-day" value="7" />
                  Su
                </label>
                <label class="settings-option">
                  <input type="checkbox" data-role="weekend-day" value="1" />
                  Mo
                </label>
                <label class="settings-option">
                  <input type="checkbox" data-role="weekend-day" value="2" />
                  Tu
                </label>
                <label class="settings-option">
                  <input type="checkbox" data-role="weekend-day" value="3" />
                  We
                </label>
                <label class="settings-option">
                  <input type="checkbox" data-role="weekend-day" value="4" />
                  Th
                </label>
                <label class="settings-option">
                  <input type="checkbox" data-role="weekend-day" value="5" />
                  Fr
                </label>
                <label class="settings-option">
                  <input type="checkbox" data-role="weekend-day" value="6" />
                  Sa
                </label>
              </div>
            </fieldset>
            <p class="settings-hint" data-role="weekend-hint"></p>
          </div>
          <div class="settings-group settings-group-hijri" data-role="hijri-fields">
            <div class="settings-pair">
              <label class="settings-field">
                <span class="settings-label settings-hijri">Hijri calendar</span>
                <select class="settings-input" data-role="variant">
                  <option value="umalqura">Umm al-Qura</option>
                  <option value="tabular">Tabular</option>
                </select>
              </label>
              <fieldset class="settings-choice">
                <legend class="settings-label settings-legend settings-hijri">
                  Hijri date adjustment
                </legend>
                <div class="settings-options">
                  <label class="settings-option">
                    <input type="radio" data-role="adjust" value="-1" />
                    &minus;1
                  </label>
                  <label class="settings-option">
                    <input type="radio" data-role="adjust" value="0" />
                    0
                  </label>
                  <label class="settings-option">
                    <input type="radio" data-role="adjust" value="1" />
                    +1
                  </label>
                </div>
              </fieldset>
            </div>
            <p class="settings-hint settings-hijri">
              Days added to the calculated Hijri date, to match local moon sighting.
            </p>
          </div>
        </div>
      </li>
    </template>

    <template id="settings-holiday-template">
      <li class="settings-holiday">
        <span class="settings-holiday-text" data-role="holiday-text"></span>
        <button type="button" class="button" data-role="holiday-action"></button>
      </li>
    </template>

    <template id="settings-import-template">
      <li class="settings-holiday">
        <span class="settings-holiday-text" data-role="import-text">
          <span class="settings-import-line" data-role="import-name"></span>
          <span class="settings-import-line settings-hint" data-role="import-time"></span>
          <span class="settings-import-line settings-hint" data-role="import-counts"></span>
        </span>
        <button type="button" class="button" data-role="import-delete">Delete</button>
      </li>
    </template>

    <template id="error-screen-template">
      <section class="crash" role="alert">
        <h2>Something went wrong</h2>
        <pre class="crash-details" data-role="details"></pre>
      </section>
    </template>
    <!--zuno:script-->
  </body>
</html>
