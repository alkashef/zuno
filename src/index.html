<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--zuno:csp-->
    <title>Global Timer</title>
    <!--zuno:style-->
  </head>
  <body>
    <header class="header" data-role="header">
      <span class="header-logo" aria-hidden="true"></span>
      <h1 class="header-title">Global Timer</h1>
      <p class="header-updated" data-role="updated"></p>
      <span class="notices" data-role="notices">
        <button
          type="button"
          class="button notices-button"
          data-action="toggleNotices"
          aria-label="Notices"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          i
          <span class="notices-badge" data-role="notices-badge" hidden></span>
        </button>
        <div
          class="notices-card"
          data-role="notices-card"
          role="dialog"
          aria-label="Notices"
          hidden
        >
          <ul class="notices-list" data-role="notices-list"></ul>
        </div>
      </span>
      <button type="button" class="button" data-action="refresh">Refresh</button>
      <button type="button" class="button" data-action="openSettings">Settings</button>
    </header>
    <main class="page" data-role="page"></main>

    <template id="legend-template">
      <footer class="legend" data-role="legend" aria-label="Legend">
        <ul class="legend-list">
          <li class="legend-item">
            <span class="legend-swatch legend-swatch-weekend" data-role="legend-swatch"></span>
            <span data-role="legend-name">Weekend</span>
          </li>
          <li class="legend-item">
            <span class="legend-swatch legend-swatch-holiday" data-role="legend-swatch"></span>
            <span data-role="legend-name">Public holiday</span>
          </li>
          <li class="legend-item">
            <span class="legend-swatch legend-swatch-working" data-role="legend-swatch"></span>
            <span data-role="legend-name">Working hours</span>
          </li>
          <li class="legend-item">
            <span class="legend-swatch legend-swatch-non-working" data-role="legend-swatch"></span>
            <span data-role="legend-name">Non-working hours</span>
          </li>
          <li class="legend-item">
            <span class="legend-swatch legend-swatch-day-off" data-role="legend-swatch"></span>
            <span data-role="legend-name">Day off</span>
          </li>
        </ul>
      </footer>
    </template>

    <template id="notice-item-template">
      <li class="notices-item" data-role="notice-item"></li>
    </template>

    <template id="empty-page-template">
      <section class="empty" data-role="empty" aria-labelledby="empty-title">
        <h2 id="empty-title">No places yet</h2>
        <p>Add a place to see its local time, weekends and public holidays.</p>
        <button type="button" class="button" data-action="openSettings">Add a place</button>
      </section>
    </template>

    <template id="map-template">
      <section class="map" data-role="map" aria-label="World map">
        <svg
          class="map-outline"
          viewBox="0 0 360 180"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            class="map-land"
            d="M12 24 L40 20 L85 18 L118 30 L125 40 L113 45 L104 52 L99 59 L100 65 L90 61 L83 63 L83 70 L93 69 L97 80 L102 82 L88 75 L75 70 L68 60 L62 57 L56 50 L55 41 L45 32 L30 30 L15 30 Z M107 12 L130 8 L160 8 L165 22 L145 32 L132 30 L118 28 Z M100 90 L103 82 L118 80 L130 90 L145 96 L141 105 L132 116 L122 128 L115 132 L112 145 L106 140 L108 120 L110 108 L99 96 Z M171 52 L171 47 L178 42 L184 38 L190 35 L185 28 L195 21 L210 19 L240 20 L280 12 L320 18 L360 22 L350 30 L340 35 L320 40 L310 48 L302 52 L302 60 L290 70 L286 80 L280 77 L280 88 L275 74 L268 68 L260 80 L253 70 L248 66 L237 65 L238 67 L232 74 L223 77 L215 62 L215 55 L208 53 L206 50 L192 48 L183 47 L175 54 Z M163 69 L170 60 L174 54 L190 53 L212 59 L215 62 L223 78 L231 78 L220 93 L220 105 L213 116 L200 125 L195 118 L192 107 L189 91 L189 86 L172 86 L163 76 Z M294 112 L310 102 L322 101 L333 116 L326 129 L315 125 L295 124 Z M176 38 L181 34 L182 40 L177 42 Z M322 52 L326 48 L330 52 L326 60 Z M280 88 L300 92 L296 94 L282 92 Z M352 130 L356 126 L358 134 Z M0 160 L360 160 L360 180 L0 180 Z"
          />
        </svg>
        <ol class="map-pins" data-role="pins"></ol>
      </section>
    </template>

    <template id="map-pin-template">
      <li class="map-pin" data-role="pin">
        <span class="map-pin-dot" aria-hidden="true"></span>
        <span class="map-pin-label">
          <span class="map-pin-name" data-role="pin-name"></span>
          <span class="map-pin-time" data-role="pin-time"></span>
          <span class="map-pin-date" data-role="pin-date"></span>
        </span>
      </li>
    </template>

    <template id="month-grid-template">
      <section class="month-grid" data-role="month-grid" aria-labelledby="month-grid-title">
        <div class="month-grid-header">
          <button type="button" class="button" data-role="earlier" aria-label="Previous month">
            &#x2039;
          </button>
          <h2 id="month-grid-title" class="month-grid-title" data-role="title"></h2>
          <button type="button" class="button" data-role="later" aria-label="Next month">
            &#x203A;
          </button>
        </div>
        <div class="month-grid-scroll" data-role="grid-scroll">
          <table class="month-grid-table">
            <thead data-role="head"></thead>
            <tbody data-role="body"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="month-grid-card-template">
      <div class="month-grid-card" role="dialog" aria-label="Holiday">
        <p class="month-grid-card-name" data-role="card-name"></p>
        <p data-role="card-date"></p>
        <p class="month-grid-card-hijri" data-role="card-hijri" hidden></p>
        <button type="button" class="button" data-role="card-close" aria-label="Close holiday">
          &#x2715;
        </button>
      </div>
    </template>

    <template id="hijri-note-template">
      <span class="hijri-note" data-role="hijri-note">
        <button
          type="button"
          class="button hijri-note-button"
          data-role="note-button"
          aria-label="About Hijri dates"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          i
        </button>
        <div
          class="hijri-note-card"
          data-role="note-card"
          role="dialog"
          aria-label="About Hijri dates"
          hidden
        >
          Hijri dates are calculated and may differ from official announcements.
        </div>
      </span>
    </template>

    <template id="picker-template">
      <section class="picker" data-role="picker" aria-labelledby="picker-title">
        <h2 id="picker-title" class="picker-title">Time picker</h2>
        <div data-role="day-selector-slot"></div>
        <div class="picker-scroll" data-role="scroll">
          <div class="picker-axis" data-role="axis">
            <div
              class="picker-handle"
              data-role="handle"
              role="slider"
              tabindex="0"
              aria-label="Chosen time"
            ></div>
          </div>
          <div class="picker-content">
            <ul class="picker-rows" data-role="rows"></ul>
            <div class="picker-line"></div>
          </div>
        </div>
      </section>
    </template>

    <template id="picker-row-template">
      <li class="picker-row" data-role="row">
        <div class="picker-info" data-role="info">
          <span class="picker-name" data-role="name"></span>
          <span data-role="local-date"></span>
          <span class="picker-hijri" data-role="local-hijri" hidden></span>
          <span data-role="local-time"></span>
        </div>
        <div class="picker-track" data-role="track"></div>
      </li>
    </template>

    <template id="day-selector-template">
      <div class="day-selector" data-role="day-selector">
        <button type="button" class="button" data-role="previous" aria-label="Previous day">
          &#x2039;
        </button>
        <button
          type="button"
          class="button day-selector-date"
          data-role="date"
          aria-haspopup="dialog"
          aria-expanded="false"
        ></button>
        <button type="button" class="button" data-role="next" aria-label="Next day">
          &#x203A;
        </button>
      </div>
    </template>

    <template id="calendar-template">
      <div class="calendar" data-role="calendar" role="dialog" aria-label="Choose a day">
        <div class="calendar-header">
          <button type="button" class="button" data-role="earlier" aria-label="Earlier month">
            &#x2039;
          </button>
          <h3 class="calendar-title" data-role="title"></h3>
          <button type="button" class="button" data-role="later" aria-label="Later month">
            &#x203A;
          </button>
        </div>
        <table class="calendar-table">
          <thead>
            <tr>
              <th scope="col">Mo</th>
              <th scope="col">Tu</th>
              <th scope="col">We</th>
              <th scope="col">Th</th>
              <th scope="col">Fr</th>
              <th scope="col">Sa</th>
              <th scope="col">Su</th>
            </tr>
          </thead>
          <tbody data-role="weeks"></tbody>
        </table>
      </div>
    </template>

    <template id="settings-panel-template">
      <aside class="settings" data-role="settings" role="dialog" aria-labelledby="settings-title">
        <div class="settings-header">
          <h2 id="settings-title">Settings</h2>
          <button type="button" class="button" data-role="close" aria-label="Close settings">
            &#x2715;
          </button>
        </div>
        <h3>Working hours</h3>
        <div class="settings-hours">
          <label class="settings-field">
            Working hours start
            <input type="time" class="settings-input" data-role="work-start" required />
          </label>
          <label class="settings-field">
            Working hours end
            <input type="time" class="settings-input" data-role="work-end" required />
          </label>
        </div>
        <h3>Display</h3>
        <div class="settings-display">
          <label class="settings-check">
            <input type="checkbox" data-role="show-country" />
            Show names of countries
          </label>
          <label class="settings-check">
            <input type="checkbox" data-role="show-hijri" />
            Show Hijri calendar
          </label>
        </div>
        <h3>Places</h3>
        <ul class="settings-places" data-role="places"></ul>
        <form class="settings-add" data-role="add-form">
          <label class="settings-field">
            Country
            <select class="settings-input" data-role="country">
              <option value="">Choose a country</option>
            </select>
          </label>
          <button type="submit" class="button">Add place</button>
        </form>
      </aside>
    </template>

    <template id="settings-place-template">
      <li class="settings-place">
        <div class="settings-place-row">
          <span class="settings-place-name" data-role="name"></span>
          <span class="settings-place-time" data-role="time"></span>
          <button type="button" class="button" data-role="up">&#x2191;</button>
          <button type="button" class="button" data-role="down">&#x2193;</button>
          <button type="button" class="button" data-role="toggle" aria-expanded="false">
            &#x270E;
          </button>
          <button type="button" class="button" data-role="remove">&#x2715;</button>
        </div>
        <div class="settings-place-edit" data-role="edit" hidden>
          <label class="settings-field">
            Display name
            <input type="text" class="settings-input" data-role="label" />
          </label>
          <label class="settings-field" data-role="zone-field">
            City time zone
            <select class="settings-input" data-role="zone"></select>
          </label>
          <label class="settings-field">
            Region
            <select class="settings-input" data-role="region"></select>
          </label>
          <label class="settings-field" data-role="variant-field">
            Hijri variant
            <select class="settings-input" data-role="variant">
              <option value="umalqura">Umm al-Qura</option>
              <option value="tabular">Tabular</option>
            </select>
          </label>
          <label class="settings-field" data-role="adjust-field">
            Hijri adjustment
            <select class="settings-input" data-role="adjust">
              <option value="-1">-1</option>
              <option value="0">0</option>
              <option value="1">+1</option>
            </select>
          </label>
        </div>
      </li>
    </template>

    <template id="error-screen-template">
      <section class="crash" role="alert">
        <h2>Something went wrong</h2>
        <pre class="crash-details" data-role="details"></pre>
      </section>
    </template>
    <!--zuno:script-->
  </body>
</html>
